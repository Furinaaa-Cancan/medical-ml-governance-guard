# MLGG pre-commit hooks — fast local feedback before push.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
#
# Design notes:
# - ruff is authoritative per ruff.toml; CI enforces the same ruleset.
# - mlgg-lint runs against its own source (plugin/mlgg_lint/) only —
#   running it on scripts/ produces false positives because gate code
#   legitimately calls dropna()/fit() on internal evidence dataframes
#   (not user CSVs). See ci-unit.yml for the same scoping.
# - Docs-consistency script is a local hook because it needs the repo
#   file layout and cannot be pip-installed.
# - No auto-fix for ruff (--fix) — developers should see and decide.
#   Use `ruff check scripts/ --fix` manually when wanted.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--no-fix]
        files: ^scripts/

  - repo: local
    hooks:
      - id: mlgg-lint-selfcheck
        name: mlgg-lint on its own source
        entry: python3 -m mlgg_lint check plugin/mlgg_lint/ --exit-code
        language: system
        pass_filenames: false
        files: ^plugin/mlgg_lint/.*\.py$

      - id: docs-consistency
        name: 12-dim scoring doc consistency
        entry: python3 scripts/diagnostics/check_docs_consistency.py
        language: system
        pass_filenames: false
        files: ^(SKILL\.md|README(_EN)?\.md|agents/reviewer\.yaml)$

      # Runs on any KB-adjacent edit. Catches invalid gate names,
      # categories outside the 13-allowlist, non-enum severities,
      # and malformed mlgg_rules ids — the exact class of pollution
      # Codex found 13 instances of during the 2026-04-23 review.
      - id: kb-hygiene
        name: peer-review-kb hygiene (gate refs, category allowlist, severity)
        entry: python3 scripts/diagnostics/kb_hygiene_check.py --strict
        language: system
        pass_filenames: false
        files: ^(references/case-studies/peer-review-kb\.json|scripts/core/_gate_registry\.py|scripts/review/backfill_peer_review_gates\.py)$

      # UKB codebook completeness — L1 source fidelity + L2 structural
      # invariants + L3 golden-seed fields. Runs on any change to the
      # UKB .txt files, SQLite, manifest, or golden-seed YAML. Refuses
      # commits that introduce silent drift (e.g., a stale copy or an
      # unintended schema change).
      - id: ukb-codebook-verify
        name: UKB codebook 3-layer completeness check
        entry: python3 scripts/codebooks/verify_ukb_codebook.py
        language: system
        pass_filenames: false
        files: ^references/codebooks/ukb/(.*\.txt|.*\.sqlite.*|source_manifest\.json|ukb_golden_fields\.yaml)$

      # README numeric-claim drift: "106 papers" vs live "119",
      # "4722 tests" vs actual.
      #
      # H3 (2026-05-17): widened from file-scoped to always_run.
      # Previously this only fired on README/KB edits, which missed
      # the common case: a gate/test commit silently changes the
      # live count without touching README, then CI catches the drift
      # one merge later. 4+ historical reds (A4, A10, F5, G-wave) all
      # fit this pattern. Cost: ~1s per commit. Bypass: --no-verify.
      - id: readme-stats-drift
        name: README stats parity + freshness (CN ↔ EN, vs live KB)
        entry: python3 scripts/diagnostics/check_readme_stats.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
