- field_id: 131286
  title_contains: "Date I10 first reported"
  # essential (primary) hypertension first-occurrence date

# ── ICD-10 dictionary — known heroes (encoding_id=19) ─────────────
# UKB uses WHO's original ICD-10 1990s terminology — NOT the modern
# re-branded names ("Type 2 DM" vs "Non-insulin-dependent DM", "CKD"
# vs "Chronic renal failure"). Golden seeds target the exact strings
# the DB holds, so a regression (different WHO revision imported)
# surfaces immediately.
- icd10: "E11"
  title_contains: "non-insulin-dependent diabetes"
- icd10: "I21"
  title_contains: "myocardial infarction"
- icd10: "I63"
  title_contains: "cerebral infarction"
- icd10: "C50"
  title_contains: "breast"
- icd10: "J18"
  title_contains: "pneumonia"
- icd10: "N18"
  title_contains: "chronic renal failure"
- icd10: "F32"
  title_contains: "depress"
- icd10: "K70"
  title_contains: "alcohol"
