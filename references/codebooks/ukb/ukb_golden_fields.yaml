# ── ICD-10 dictionary — WHO 1990 terminology ─────────────────────
# UKB uses WHO's original ICD-10 1990s terminology — NOT the modern
# re-branded names ("Type 2 DM" vs "Non-insulin-dependent DM", "CKD"
# vs "Chronic renal failure"). Golden seeds target the exact strings
# the DB holds, so a regression (different WHO revision imported)
# surfaces immediately.
