# UKB golden-seed fields (L3 completeness check).
#
# Each entry declares a field/code that MUST exist in our local
# codebook with the stated metadata. Additions are welcome; never
# remove an entry without investigating why it's missing from the
# live DB (that's the exact regression this file catches).
#
# Coverage target: at least one representative field per domain so
# a builder bug that drops a whole category surfaces immediately.
# 2026-04-23 round-8 deep-check expanded coverage 32 → 200 entries
# across 49 domains.
#
# Schema:
#   - field_id: <int>
#     title_contains: <str, optional>   # substring match, case-insensitive
#     title: <str, optional>             # exact match
#     main_category: <int, optional>
#   - icd10: <str>
#     title_contains: <str, optional>

