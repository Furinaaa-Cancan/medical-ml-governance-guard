name: ci-unit

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: |
          ruff check scripts/ || echo "::warning::ruff found lint issues (non-blocking until existing issues are resolved)"

      - name: Unit tests (exclude slow)
        run: |
          python3 -m pytest tests/ -m "not slow" --tb=short -q \
            --ignore=tests/test_onboarding_smoke.py \
            --ignore=tests/test_play_smoke.py \
            --cov=scripts --cov-report=term-missing --cov-fail-under=85
