# CodeQL static analysis — covers Python source surface.
# Reference: https://docs.github.com/en/code-security/code-scanning
#
# Triggers:
#   - Push to main (so any merged change is scanned immediately).
#   - PRs targeting main (so we catch issues before merge).
#   - Weekly schedule (catches new query updates from GitHub Security Lab
#     against existing code without a new push).
#
# Query suite:
#   - security-extended: superset of default; includes more vulnerability
#     queries (CWE-94 code injection, CWE-89 SQLi, CWE-78 command injection,
#     CWE-22 path traversal, ...). Fits the project's NEVER list (no eval/
#     exec/subprocess(shell=True)/os.system) — CodeQL enforces it
#     mechanically rather than relying on lint discipline alone.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:30 UTC = 11:30 Beijing
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Triage decision 2026-05-17 (see SECURITY_TRIAGE.md):
          # The previous `security-extended,security-and-quality` combo
          # produced 344 alerts on first scan, of which 1 was a real bug
          # (tempfile.mktemp TOCTOU in verify_nhanes_codebook.py — fixed
          # in commit alongside this config). The rest were:
          #   - 123 py/unused-import   (style; ruff handles)
          #   - 55 py/unused-local-variable + 15 py/unused-global-variable
          #     (style; ruff handles)
          #   - 72 py/empty-except     (some intentional; ruff B902 covers)
          #   - 17 py/clear-text-logging-sensitive-data (CLI tool printing
          #     audit reports is the project's purpose)
          #   - 10 py/incomplete-url-substring-sanitization (counting stats
          #     on paper-cited URLs, not security gating)
          #   - 3 py/uninitialized-local-variable in tests (CodeQL doesn't
          #     model pytest.skip() flow control — false positives)
          # Dropping `security-and-quality` removes ~278 style-only
          # findings (note severity) while keeping every real security
          # query. Configured filters below also suppress the remaining
          # known false-positive classes.
          queries: security-extended
          config: |
            paths:
              - scripts/
              - plugin/
              - tests/
            paths-ignore:
              - .cache/
              - experiments/
              - paper/
              - references/_unused/
            # Suppress known false-positive classes (see SECURITY_TRIAGE.md
            # for the per-class triage). New rules / unknown classes still
            # appear in the dashboard — these are the ones we've already
            # audited and judged not applicable to this codebase.
            query-filters:
              - exclude:
                  id: py/clear-text-logging-sensitive-data
              - exclude:
                  id: py/incomplete-url-substring-sanitization
              - exclude:
                  id: py/uninitialized-local-variable
                  paths: ["tests/**"]

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
