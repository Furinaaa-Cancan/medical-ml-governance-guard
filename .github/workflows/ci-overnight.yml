name: ci-overnight

on:
  schedule:
    - cron: "0 22 * * *"  # Every night at 10 PM UTC
  workflow_dispatch:

jobs:
  overnight-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Mirror ci-unit's install step exactly. Each piece below was
        # added because a specific test in the "Fast tests" sweep failed
        # without it:
        #   requirements-optional.txt → imblearn (BalancedRandomForest /
        #     EasyEnsemble / RUSBoost test families)
        #   pytest hypothesis → test_math_properties (property-based)
        #   pip install -e plugin/ → mlgg-lint rule fixture tests
        # When divergent install steps exist, ci-unit and ci-overnight
        # will report different test failures on the same code, which
        # is exactly what was happening through 5+ nightly red runs.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-optional.txt
          python3 -m pip install pytest hypothesis
          python3 -m pip install -e plugin/

      - name: Fast tests (full suite, non-slow)
        run: python3 -m pytest tests/ -m "not slow" --tb=short -q

      - name: Stress tests (slow, ~6 hours total)
        run: |
          # `set -o pipefail` so the pipeline reports pytest's exit code,
          # not tee's (which is always 0). Without this, real stress
          # failures get silently masked — overnight "green" stopped
          # reflecting actual stress-test state.
          set -o pipefail
          python3 -m pytest tests/ -m "slow" --tb=short -v \
            2>&1 | tee /tmp/overnight_results.txt

      - name: Collect results
        if: always()
        run: |
          mkdir -p /tmp/overnight_artifacts
          cp /tmp/overnight_results.txt /tmp/overnight_artifacts/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-py${{ matrix.python-version }}
          path: /tmp/overnight_artifacts
