name: ci-full

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: KB hygiene (peer-review-kb gate refs + category + severity)
        # Fails the nightly if a past commit introduced invalid gate
        # references, out-of-allowlist categories, or non-enum severity
        # values. Pre-commit catches these at author time; nightly
        # catches cases where pre-commit was bypassed or the registry
        # changed after the fact.
        run: |
          python3 scripts/diagnostics/kb_hygiene_check.py --strict \
            --report /tmp/mlgg_kb_hygiene_report.json

      - name: Retrieval end-to-end regression (seed scenarios)
        # Runs the 3-scenario retrieval eval and compares to the pinned
        # baseline in references/retrieval_eval/baseline.json. Fails
        # if any scenario drops below its baseline coverage / hit@K /
        # tag_precision-floor. Catches KB rewording or synonym-table
        # changes that silently tank retrieval quality.
        run: |
          python3 scripts/diagnostics/retrieval_eval_harness.py \
            --scenarios references/retrieval_eval/scenarios.json \
            --baseline references/retrieval_eval/baseline.json \
            --report /tmp/mlgg_retrieval_eval_report.json \
            --strict

      - name: Full onboarding (guided demo)
        run: |
          python3 scripts/orchestration/mlgg.py onboarding \
            --project-root /tmp/mlgg_ci_demo \
            --mode auto \
            --yes

      - name: Release benchmark suite (blocking)
        run: |
          python3 scripts/orchestration/mlgg.py benchmark-suite \
            --profile release \
            --output /tmp/mlgg_release_benchmark_summary.ci_full.json \
            --artifacts-dir /tmp/mlgg_release_benchmark_runs \
            --emit-junit /tmp/mlgg_release_benchmark.junit.xml

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p /tmp/mlgg_ci_artifacts
          if [ -f /tmp/mlgg_release_benchmark_summary.ci_full.json ]; then
            cp /tmp/mlgg_release_benchmark_summary.ci_full.json /tmp/mlgg_ci_artifacts/
          fi
          if [ -f /tmp/mlgg_release_benchmark.junit.xml ]; then
            cp /tmp/mlgg_release_benchmark.junit.xml /tmp/mlgg_ci_artifacts/
          fi
          if [ -d /tmp/mlgg_release_benchmark_runs ]; then
            cp -R /tmp/mlgg_release_benchmark_runs /tmp/mlgg_ci_artifacts/
          fi
          if [ -f /tmp/mlgg_kb_hygiene_report.json ]; then
            cp /tmp/mlgg_kb_hygiene_report.json /tmp/mlgg_ci_artifacts/
          fi
          if [ -f /tmp/mlgg_retrieval_eval_report.json ]; then
            cp /tmp/mlgg_retrieval_eval_report.json /tmp/mlgg_ci_artifacts/
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-artifacts
          path: /tmp/mlgg_ci_artifacts
