# Dependabot configuration — keep dependencies fresh and CVE-aware.
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
#   - Weekly checks (Monday 06:00 UTC = 14:00 Beijing) to land before workweek.
#   - Group patch + minor updates per ecosystem so we don't drown in 30 PRs.
#   - Major-version bumps stay separate (could be breaking).
#   - Cap open PRs to keep the queue reviewable.

version: 2
updates:
  # Python runtime + dev deps
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      # Patch & minor for runtime — usually safe, batch together
      python-runtime-patch-minor:
        applies-to: version-updates
        patterns:
          - "numpy"
          - "scikit-learn"
          - "pandas"
          - "scipy"
          - "matplotlib"
          - "requests"
          - "sentence-transformers"
          - "huggingface-hub"
          - "transformers"
        update-types:
          - "patch"
          - "minor"
      # Dev / test stack patch & minor
      python-dev-patch-minor:
        applies-to: version-updates
        patterns:
          - "pytest"
          - "pytest-*"
          - "hypothesis"
          - "ruff"
          - "mypy"
          - "coverage"
          - "pre-commit"
        update-types:
          - "patch"
          - "minor"
      # Security updates always grouped together (priority queue)
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
