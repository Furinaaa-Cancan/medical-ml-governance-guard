[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-governance-guard"
version = "1.0.0"
description = "Publication-grade medical prediction workflow with 33 fail-closed governance gates."
readme = "README.md"
license = {text = "PolyForm Noncommercial License 1.0.0"}
requires-python = ">=3.10"
authors = [
    {name = "ml-governance-guard contributors"},
]
keywords = ["medical", "machine-learning", "governance", "prediction", "publication-grade"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "joblib>=1.2",
    "tomli>=1.1.0;python_version<'3.11'",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
catboost = ["catboost>=1.2"]
lightgbm = ["lightgbm>=3.3"]
tabpfn = ["tabpfn>=0.1"]
optuna = ["optuna>=3.0"]
web = ["flask>=3.0"]
shap = ["shap>=0.42"]
all = ["xgboost>=1.7", "catboost>=1.2", "lightgbm>=3.3", "tabpfn>=0.1", "optuna>=3.0", "flask>=3.0", "shap>=0.42"]
dev = ["pytest>=7.0", "pytest-cov", "pytest-timeout>=2.1.0"]

[project.scripts]
mlgg = "scripts.orchestration.mlgg:cli_main"
mlgg-pixel = "scripts.orchestration.mlgg_pixel:main"

[project.urls]
Repository = "https://github.com/Furinaaa-Cancan/medical-ml-governance-guard"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (skipped in ci-unit with -m 'not slow')",
    "timeout: marks tests with a maximum execution timeout (requires pytest-timeout)",
]

[tool.setuptools.packages.find]
include = ["scripts*", "experiments*", "references*", "plugin*"]

[tool.setuptools.package-data]
references = ["*.json", "*.md", "*.csv"]
